name: Security Scanning Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Jobs (the three scan jobs run in parallel):
#   prepare            GitHub cloud   choose the mode
#   unit-tests         GitHub cloud   install deps + unit tests
#   dynamic-tests      GitHub cloud   start the app, Newman, OWASP ZAP (heaviest)
#   sonar-scan         scan runner    SonarQube scan + quality gate
#   defectdojo-report  scan runner    DefectDojo import + final JSON/HTML report
#   collect-report     GitHub cloud   upload the named report artifact + summary
# "scan runner" = the office runner in on-prem mode, GitHub cloud in GCP mode.
# Only sonar-scan and defectdojo-report need to reach SonarQube/DefectDojo, so
# on-prem only those two light jobs use the office machine.
#
# Runs in one of two modes, decided by the `prepare` job on every run:
#
#   onprem — repo/org Variable CS_DEVTEST_BROKER_URL is set.
#            The SonarQube and DefectDojo jobs run on a self-hosted runner
#            INSIDE the office LAN (labels: self-hosted, lan) and talk to the
#            on-prem credential broker.
#   gcp    — GitHub Secret SONAR_HOST_URL is set (and no broker URL).
#            Every job runs on GitHub's ubuntu-latest and talks to the public
#            SonarQube/DefectDojo with the SONAR_* / DEFECTDOJO_* secrets.
#   skip   — neither is configured, or (on-prem) no online LAN runner was
#            found. The scan jobs are skipped instead of queuing forever.
#
# Optional:
#   Variable CS_DEVTEST_MODE = onprem | gcp | skip  — force a mode.
#   Secret   RUNNER_STATUS_TOKEN — fine-grained PAT with "Administration: read"
#            on the repo (and/or org "Self-hosted runners: read"). When set, an
#            on-prem run is skipped if no online `self-hosted, lan` runner exists.
#            GitHub's built-in token cannot see runners, so without this the
#            on-prem job waits in the queue until a runner comes online.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# One scan per branch at a time; a newer push cancels the older run.
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── JOB 1: PREPARE — metadata + decide where the scans run ──────────────────
  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    outputs:
      short_sha:   ${{ steps.meta.outputs.short_sha }}
      run_date:    ${{ steps.meta.outputs.run_date }}
      report_name: ${{ steps.meta.outputs.report_name }}
      mode:        ${{ steps.mode.outputs.mode }}
      runner:      ${{ steps.mode.outputs.runner }}

    steps:
      - name: Set metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          RUN_DATE=$(date +%Y-%m-%d)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          {
            echo "short_sha=${SHORT_SHA}"
            echo "run_date=${RUN_DATE}"
            echo "report_name=security-report-${BRANCH}-${SHORT_SHA}-${RUN_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide scan mode (on-prem / GCP / skip)
        id: mode
        env:
          MODE_OVERRIDE:       ${{ vars.CS_DEVTEST_MODE }}
          BROKER_URL:          ${{ vars.CS_DEVTEST_BROKER_URL }}
          SONAR_HOST_URL:      ${{ secrets.SONAR_HOST_URL }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          REPO:                ${{ github.repository }}
          OWNER:               ${{ github.repository_owner }}
        run: |
          MODE="${MODE_OVERRIDE:-}"
          REASON=""
          if [ -z "$MODE" ]; then
            if [ -n "$BROKER_URL" ]; then
              MODE=onprem; REASON="CS_DEVTEST_BROKER_URL variable is set"
            elif [ -n "$SONAR_HOST_URL" ]; then
              MODE=gcp; REASON="SONAR_HOST_URL secret is set"
            else
              MODE=skip; REASON="neither the CS_DEVTEST_BROKER_URL variable (on-prem) nor the SONAR_HOST_URL secret (GCP) is configured"
            fi
          else
            REASON="forced by CS_DEVTEST_MODE"
          fi

          case "$MODE" in
            onprem)
              if [ -z "$BROKER_URL" ]; then
                MODE=skip; REASON="on-prem mode needs the CS_DEVTEST_BROKER_URL variable"
              fi ;;
            gcp)
              if [ -z "$SONAR_HOST_URL" ]; then
                MODE=skip; REASON="GCP mode needs the SONAR_HOST_URL secret"
              fi ;;
            skip) ;;
            *) echo "::error::CS_DEVTEST_MODE must be onprem, gcp or skip (got '$MODE')"; exit 1 ;;
          esac

          # On-prem: optionally confirm an online `self-hosted, lan` runner exists,
          # so the scan job does not sit in the queue for hours.
          if [ "$MODE" = "onprem" ] && [ -n "$RUNNER_STATUS_TOKEN" ]; then
            ONLINE=0; API_OK=false
            for scope in "repos/$REPO" "orgs/$OWNER"; do
              BODY=$(curl -sS -f -H "Authorization: Bearer $RUNNER_STATUS_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/$scope/actions/runners?per_page=100" 2>/dev/null) || continue
              API_OK=true
              N=$(echo "$BODY" | jq '[.runners[] | select(.status == "online")
                    | select(any(.labels[]; .name == "self-hosted") and any(.labels[]; .name == "lan"))] | length')
              ONLINE=$((ONLINE + N))
            done
            if [ "$API_OK" = "false" ]; then
              echo "::warning::RUNNER_STATUS_TOKEN could not list runners; queuing the on-prem job anyway."
            elif [ "$ONLINE" -eq 0 ]; then
              MODE=skip; REASON="no online self-hosted runner with labels 'self-hosted, lan' was found"
            else
              REASON="$REASON; $ONLINE online LAN runner(s) found"
            fi
          fi

          case "$MODE" in
            onprem) RUNNER='["self-hosted","lan"]' ;;
            *)      RUNNER='"ubuntu-latest"' ;;
          esac

          echo "mode=$MODE"     >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Scan mode: $MODE ($REASON)"
          {
            echo "### Scan mode: \`$MODE\`"
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "skip" ]; then
            echo "::notice::Security scans skipped: $REASON"
          fi

  # ── JOB 2: UNIT TESTS — GitHub cloud (no office network needed) ─────────────
  unit-tests:
    name: "Unit Tests"
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p ~/security-scan/app ~/security-scan/scripts ~/security-scan/reports
          cp -r . ~/security-scan/app/
          cp .github/scripts/run-all-scans.sh ~/security-scan/scripts/

      - name: Run unit tests
        env:
          SCAN_STAGE: tests
          SCAN_MODE:  ${{ needs.prepare.outputs.mode }}
          GIT_SHA:    ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          RUN_DATE:   ${{ needs.prepare.outputs.run_date }}
        run: bash ~/security-scan/scripts/run-all-scans.sh

      - name: Upload stage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-tests-${{ needs.prepare.outputs.short_sha }}
          path: ~/security-scan/reports/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  # ── JOB 3: APP + NEWMAN + OWASP ZAP — GitHub cloud (heaviest job) ───────────
  dynamic-tests:
    name: "API Tests + OWASP ZAP"
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p ~/security-scan/app ~/security-scan/scripts ~/security-scan/reports
          chmod -R 777 ~/security-scan/reports
          cp -r . ~/security-scan/app/
          cp .github/scripts/run-all-scans.sh ~/security-scan/scripts/

      - name: Start app, run Newman and OWASP ZAP
        env:
          SCAN_STAGE:      dynamic
          SCAN_MODE:       ${{ needs.prepare.outputs.mode }}
          GIT_SHA:         ${{ github.sha }}
          GIT_BRANCH:      ${{ github.ref_name }}
          RUN_DATE:        ${{ needs.prepare.outputs.run_date }}
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          COLLECTION_UID:  ${{ secrets.COLLECTION_UID }}
        run: bash ~/security-scan/scripts/run-all-scans.sh

      - name: Upload stage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-dynamic-${{ needs.prepare.outputs.short_sha }}
          path: ~/security-scan/reports/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  # ── JOB 4: SONARQUBE SCAN — office runner (on-prem) / GitHub cloud (GCP) ────
  sonar-scan:
    name: "SonarQube Scan (${{ needs.prepare.outputs.mode }})"
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          echo "Runner: ${{ runner.name }} (${{ runner.environment }})"
          if ! command -v node &>/dev/null; then echo "✗ Node.js is required for the SonarQube scanner"; exit 1; fi
          echo "✓ Node.js: $(node --version)"
          # Self-hosted runners keep their home directory between runs.
          rm -rf ~/security-scan
          mkdir -p ~/security-scan/app ~/security-scan/scripts ~/security-scan/reports
          cp -r . ~/security-scan/app/
          cp .github/scripts/run-all-scans.sh ~/security-scan/scripts/

      - name: Run SonarQube scan + quality gate
        env:
          SCAN_STAGE:            sonar
          SCAN_MODE:             ${{ needs.prepare.outputs.mode }}
          GIT_SHA:               ${{ github.sha }}
          GIT_BRANCH:            ${{ github.ref_name }}
          RUN_DATE:              ${{ needs.prepare.outputs.run_date }}
          GIT_REPO:              ${{ github.repository }}
          CS_DEVTEST_BROKER_URL: ${{ vars.CS_DEVTEST_BROKER_URL }}
          # GCP only — never sent to the office runner
          SONAR_HOST_URL:        ${{ needs.prepare.outputs.mode == 'gcp' && secrets.SONAR_HOST_URL || '' }}
          SONAR_TOKEN:           ${{ needs.prepare.outputs.mode == 'gcp' && secrets.SONAR_TOKEN || '' }}
        run: bash ~/security-scan/scripts/run-all-scans.sh

      - name: Upload stage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-sonar-${{ needs.prepare.outputs.short_sha }}
          path: ~/security-scan/reports/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Clean up workspace
        if: always()
        run: rm -rf ~/security-scan

  # ── JOB 5: DEFECTDOJO IMPORT + FINAL REPORT — office runner / GitHub cloud ──
  # Runs even if a scan job failed, so whatever reports exist still get imported.
  defectdojo-report:
    name: "DefectDojo Import + Report (${{ needs.prepare.outputs.mode }})"
    needs: [prepare, unit-tests, dynamic-tests, sonar-scan]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.mode != 'skip' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Checkout scripts only
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Prepare workspace
        run: |
          rm -rf ~/security-scan
          mkdir -p ~/security-scan/scripts ~/security-scan/reports
          cp .github/scripts/run-all-scans.sh ~/security-scan/scripts/
          cp .github/scripts/generate-html.js ~/security-scan/scripts/ 2>/dev/null || true

      - name: Download stage reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: scan-*-${{ needs.prepare.outputs.short_sha }}
          path: ~/security-scan/reports/
          merge-multiple: true

      - name: Import into DefectDojo and build the final report
        env:
          SCAN_STAGE:               report
          SCAN_MODE:                ${{ needs.prepare.outputs.mode }}
          GIT_SHA:                  ${{ github.sha }}
          GIT_BRANCH:               ${{ github.ref_name }}
          RUN_DATE:                 ${{ needs.prepare.outputs.run_date }}
          GIT_REPO:                 ${{ github.repository }}
          CS_DEVTEST_BROKER_URL:    ${{ vars.CS_DEVTEST_BROKER_URL }}
          # GCP only — never sent to the office runner
          DEFECTDOJO_URL:           ${{ needs.prepare.outputs.mode == 'gcp' && secrets.DEFECTDOJO_URL || '' }}
          DEFECTDOJO_API_KEY:       ${{ needs.prepare.outputs.mode == 'gcp' && secrets.DEFECTDOJO_API_KEY || '' }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ needs.prepare.outputs.mode == 'gcp' && secrets.DEFECTDOJO_ENGAGEMENT_ID || '' }}
          DEFECTDOJO_PRODUCT_ID:    ${{ needs.prepare.outputs.mode == 'gcp' && secrets.DEFECTDOJO_PRODUCT_ID || '' }}
        run: bash ~/security-scan/scripts/run-all-scans.sh

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-final-${{ needs.prepare.outputs.short_sha }}
          path: |
            ~/security-scan/reports/final-report.*
            ~/security-scan/reports/scan-report.log
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Clean up workspace
        if: always()
        run: rm -rf ~/security-scan

  # ── JOB 6: UPLOAD REPORT ARTIFACT — GitHub cloud ────────────────────────────
  collect-report:
    name: "Upload Report as GitHub Artifact"
    runs-on: ubuntu-latest
    needs: [prepare, unit-tests, dynamic-tests, sonar-scan, defectdojo-report]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.mode != 'skip' }}

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: scan-*-${{ needs.prepare.outputs.short_sha }}
          path: ~/security-scan/reports/
          merge-multiple: true

      - name: Rename final reports
        id: find
        run: |
          echo "Reports available:"
          ls -lh ~/security-scan/reports/ 2>/dev/null || echo "No reports directory found"
          FOUND="none"
          for REPORT in ~/security-scan/reports/final-report.*; do
            [ -e "$REPORT" ] || continue
            EXT="${REPORT##*.}"
            DEST=~/security-scan/reports/${{ needs.prepare.outputs.report_name }}.${EXT}
            cp "${REPORT}" "${DEST}"
            echo "✓ Report ready: ${DEST}"
            FOUND="found"
          done
          echo "report_file=${{ needs.prepare.outputs.report_name }}" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" = "none" ]; then
            echo "⚠ No final reports found — uploading all raw reports as-is"
          fi

      - name: Upload as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.report_name }}
          path: ~/security-scan/reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Write job summary
        run: |
          {
            echo "## Security Scan Report"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Unit Tests | ${{ needs.unit-tests.result }} |"
            echo "| API Tests + OWASP ZAP | ${{ needs.dynamic-tests.result }} |"
            echo "| SonarQube Scan | ${{ needs.sonar-scan.result }} |"
            echo "| DefectDojo Import + Report | ${{ needs.defectdojo-report.result }} |"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Mode | \`${{ needs.prepare.outputs.mode }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ needs.prepare.outputs.short_sha }}\` |"
            echo "| Date | ${{ needs.prepare.outputs.run_date }} |"
            echo "| Report | \`${{ steps.find.outputs.report_file }}\` |"
            echo ""
            echo "Download the full report from the Artifacts section above."
          } >> "$GITHUB_STEP_SUMMARY"
